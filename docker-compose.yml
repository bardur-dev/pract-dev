version: '3.10'

services:
  # PHP Service
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php
    volumes:
      - ./:/var/www/html
    networks:
      - laravel_network

  # Nginx Service
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - php
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network

  # PostgreSQL Service
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 122
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laravel_network

    # MailHog Service
  mailhog:
      image: mailhog/mailhog:latest
      container_name: mailhog
      ports:
          - "1025:1025"
          - "8025:8025"
      networks:
          - laravel_network

    # pgAdmin Service
  pgadmin:
      image: dpage/pgadmin4
      container_name: pgadmin
      environment:
          PGADMIN_DEFAULT_EMAIL: admin@example.com
          PGADMIN_DEFAULT_PASSWORD: secret
      ports:
          - "5050:80"
      depends_on:
          - postgres
      networks:
          - laravel_network

  # Composer Service
  composer:
    image: composer:latest
    container_name: composer
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - php
    networks:
      - laravel_network

volumes:
  postgres_data:
    driver: local

networks:
  laravel_network:
    driver: bridge
